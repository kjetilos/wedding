<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pricia & Kjetil — 8.8.2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f5efe6;
      --gold: #c9a96e;
      --gold-light: #e8d5b0;
      --dark: #0e0c0a;
    }

    html, body {
      min-height: 100%;
      background: var(--dark);
      color: var(--cream);
    }

    body {
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 1.5rem 4rem;
    }

    .invite-label {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.8rem, 2.2vw, 1rem);
      letter-spacing: 0.3em;
      color: var(--gold);
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 1.4s ease 0.2s forwards;
      margin-bottom: 1.6rem;
    }

    .names {
      font-family: 'Cinzel', serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 9vw, 5.5rem);
      color: var(--cream);
      letter-spacing: 0.06em;
      line-height: 1.05;
      text-align: center;
      opacity: 0;
      animation: fadeUp 1.4s ease 0.4s forwards;
    }

    .ampersand {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      color: var(--gold);
      font-size: clamp(1.8rem, 7vw, 4.5rem);
      display: inline-block;
      margin: 0 0.3em;
      vertical-align: middle;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.6rem 0;
      opacity: 0;
      animation: fadeUp 1.4s ease 0.55s forwards;
    }

    .divider-line {
      width: 80px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .divider-line.right {
      background: linear-gradient(to left, transparent, var(--gold));
    }
    .divider-diamond {
      width: 7px;
      height: 7px;
      background: var(--gold);
      transform: rotate(45deg);
      opacity: 0.85;
    }

    .date {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(0.95rem, 3vw, 1.3rem);
      letter-spacing: 0.35em;
      color: var(--gold-light);
      text-align: center;
      opacity: 0;
      animation: fadeUp 1.4s ease 0.7s forwards;
      margin-bottom: 2.8rem;
    }

    /* Photo frame */
    .photo-frame {
      opacity: 0;
      animation: fadeUp 1.6s ease 0.9s forwards;
      filter: drop-shadow(0 0 35px rgba(201, 169, 110, 0.15)) drop-shadow(0 10px 60px rgba(0,0,0,0.9));
    }

    .frame-outer {
      padding: 6px;
      border: 1px solid rgba(201, 169, 110, 0.5);
      position: relative;
      background: var(--dark);
    }

    /* Corner ornaments using absolute positioned elements */
    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      z-index: 5;
    }
    .corner svg { width: 100%; height: 100%; stroke: var(--gold); stroke-width: 1.5; fill: none; opacity: 0.9; }
    .corner.tl { top: -1px; left: -1px; }
    .corner.tr { top: -1px; right: -1px; transform: scaleX(-1); }
    .corner.bl { bottom: -1px; left: -1px; transform: scaleY(-1); }
    .corner.br { bottom: -1px; right: -1px; transform: scale(-1,-1); }

    .frame-inner {
      border: 1px solid rgba(201, 169, 110, 0.22);
      position: relative;
    }

    .frame-inner img {
      display: block;
      width: min(370px, 82vw);
      height: auto;
    }

    .footer-text {
      margin-top: 2.4rem;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      letter-spacing: 0.1em;
      color: rgba(245, 239, 230, 0.4);
      text-align: center;
      opacity: 0;
      animation: fadeUp 1.4s ease 1.2s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .divider-line { width: 45px; }
      body { padding: 2.5rem 1rem 3rem; }
    }
  </style>
</head>
<body>

  <p class="invite-label">Together with their families</p>

  <h1 class="names">Pricia <span class="ampersand">&amp;</span> Kjetil</h1>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-diamond"></div>
    <div class="divider-line right"></div>
  </div>

  <p class="date">8 &nbsp;&middot;&nbsp; 8 &nbsp;&middot;&nbsp; 2026</p>

  <div class="photo-frame">
    <div class="frame-outer">
      <div class="corner tl"><svg viewBox="0 0 24 24"><path d="M2 22 L2 2 L22 2"/></svg></div>
      <div class="corner tr"><svg viewBox="0 0 24 24"><path d="M2 22 L2 2 L22 2"/></svg></div>
      <div class="corner bl"><svg viewBox="0 0 24 24"><path d="M2 22 L2 2 L22 2"/></svg></div>
      <div class="corner br"><svg viewBox="0 0 24 24"><path d="M2 22 L2 2 L22 2"/></svg></div>
      <div class="frame-inner">
        <img src="bg.jpg" alt="Pricia and Kjetil" />
      </div>
    </div>
  </div>

  <p class="footer-text">request the honour of your presence</p>

</body>
</html>
